name: WealthPulse
options:
  bundleIdPrefix: com.ggsheng
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "9L6N2ZF26B"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit
    from: "5.6.0"

targets:
  WealthPulse:
    type: application
    platform: iOS
    sources:
      - path: WealthPulse/Sources
      - path: WealthPulse/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.WealthPulse
        INFOPLIST_FILE: WealthPulse/Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: WealthPulse/Sources/App/WealthPulse.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: SnapKit
    entitlements:
      path: WealthPulse/Sources/App/WealthPulse.entitlements
      properties: {}

schemes:
  WealthPulse:
    build:
      targets:
        WealthPulse: all
    run:
      config: Debug
    archive:
      config: Release
